<!DOCTYPE html> 
<html>
    <head>
        <title>Sign Up Form</title>
        <link rel="stylesheet" href="styles_todo.css"> <!-- Zde propojíme s CSS souborem. -->
    </head>
    <body>
        <button class="darkmodebtn"><img src="dark-mode-icon.png" alt="Dark Mode"></button>
        <form>            
            <h1>Sign Up</h1>
            <p>Please fill in this form to create an account.</p>
            <hr>

            <!-- Přehled formulářových vstupních prvků: https://www.w3schools.com/html/html_form_input_types.asp -->
            <label for="email"><b>Email</b></label>
            <input type="email" id="email" placeholder="Enter Email" name="email" required>

            <label for="password"><b>Password</b></label>
            <input type="password" id="password" placeholder="Enter Password" name="Password" required>

            <label for="repeat-password"><b>Repeat Password</b></label>
            <input type="password" id="repeat-password" placeholder="Repeat Password" name="repeat-password" required>

            <input type="checkbox" name="newsletter" checked>
            <label for="newsletter"><b>Newsletter</b></label>

            <p>By creating an account you agree to our <a href="#" style="color:dodgerblue">Terms & Privacy</a>.</p>

            <div class="button-container">
                <button type="button" class="cancelbtn">Cancel</button>
                <button type="submit" class="signupbtn">Sign Up</button>
            </div>
        </form> 
    </body>
</html>
